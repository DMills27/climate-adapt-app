<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farming Setup Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
  <div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold text-center text-green-700">🌱 Farming Setup Assistant</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="p-4 bg-green-100 text-green-800 rounded-md">
          {% for category, message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-6 bg-white shadow-md p-6 rounded-2xl">
      <!-- Location -->
      <section>
        <h2 class="text-xl font-semibold mb-2 mt-8 text-green-600">🗺️ Visualize Location & Area</h2>
        <div id="map" class="w-full h-96 rounded-xl shadow"></div>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block font-medium mb-1">Country</label>
            <select name="country" class="input">
              <option value="">Select one</option>
              {% for c in countries %}
                <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block font-medium mb-1">Region</label>
            <input type="text" name="region" class="input" placeholder="Optional">
          </div>
          <div class="md:col-span-2">
            <label class="block font-medium mb-1">Coordinates</label>
                <input type="text" name="coordinates" class="input" placeholder="e.g. 24.45, 54.38" id="coordinates">
          </div>
        </div>
      </section>

      <!-- Space -->
      <section>
        <h2 class="text-xl font-semibold mb-4 text-green-600">🏠 Available Space</h2>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block font-medium mb-1">Type of Space</label>
            <select name="space_type" class="input">
              <option value="land">Land</option>
              <option value="rooftop">Rooftop</option>
              <option value="balcony">Balcony</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div>
            <label class="block font-medium mb-1">Area (m²)</label>
              <input type="number" name="area" class="input" placeholder="e.g. 50" id="area">
          </div>
        </div>
      </section>

      <!-- Resources -->
      <section>
        <h2 class="text-xl font-semibold mb-4 text-green-600">⚡ Resources</h2>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block font-medium mb-1">Water Access</label>
            <select name="water" class="input">
              <option value="good">Reliable</option>
              <option value="limited">Limited</option>
              <option value="none">None</option>
            </select>
          </div>
          <div>
            <label class="block font-medium mb-1">Electricity Access</label>
            <select name="electricity" class="input">
              <option value="grid">Grid</option>
              <option value="solar">Solar</option>
              <option value="none">None</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Traditions -->
      <section>
        <h2 class="text-xl font-semibold mb-4 text-green-600">🌾 Local Crops / Traditions</h2>
        <label class="block font-medium mb-1">Details</label>
        <textarea name="traditions" rows="4" class="input w-full resize-none" placeholder="e.g. tomatoes, traditional composting..."></textarea>
      </section>

      <!-- Submit -->
      <div class="text-center">
        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-semibold shadow">
          Submit Info
        </button>
      </div>
    </form>
  </div>
<!-- Leaflet CDN -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([24.45, 54.38], 13); // Initial center

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors & CartoDB',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  let areaCircle = null;

  function updateMap() {
    const coordStr = document.getElementById("coordinates").value;
    const areaVal = parseFloat(document.getElementById("area").value);

    if (!coordStr || isNaN(areaVal)) return;

    const [lat, lon] = coordStr.split(',').map(Number);
    if (isNaN(lat) || isNaN(lon)) return;

    const radius = Math.sqrt(areaVal / Math.PI); // Radius in meters

    // Center map
    map.setView([lat, lon], 17);

    // Remove previous circle
    if (areaCircle) {
      map.removeLayer(areaCircle);
    }

    // Draw new circle
    areaCircle = L.circle([lat, lon], {
      radius: radius,
      color: 'green',
      fillColor: '#4ade80',
      fillOpacity: 0.5
    }).addTo(map);
  }

  // Update map whenever input changes
  document.getElementById("coordinates").addEventListener("input", updateMap);
  document.getElementById("area").addEventListener("input", updateMap);

  // Trigger once on page load if values already filled
  window.addEventListener('load', updateMap);
</script>

</body>
</html>
